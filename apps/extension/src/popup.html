<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FluentFrame</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 16px;
        background: #0f172a;
        color: #e5eefb;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }
      .subtle {
        color: #93a4ba;
        font-size: 12px;
      }
      button {
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 8px;
        background: rgba(30, 41, 59, 0.86);
        color: #e5eefb;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: rgba(51, 65, 85, 0.9);
      }
      #generate {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 8px;
        background: #2563eb;
        border-color: #3b82f6;
        font-weight: 650;
      }
      #enqueue-current {
        width: 100%;
        padding: 9px 12px;
        margin-bottom: 10px;
        font-weight: 620;
      }
      form {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      input {
        min-width: 0;
        flex: 1;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 8px;
        padding: 8px 9px;
        background: rgba(15, 23, 42, 0.82);
        color: #e5eefb;
        font: inherit;
      }
      form button {
        padding: 8px 10px;
      }
      #refresh-health {
        width: 32px;
        height: 32px;
      }
      .status-card {
        margin-bottom: 12px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        padding: 10px;
        background: rgba(15, 23, 42, 0.72);
      }
      .queue-card {
        margin-bottom: 12px;
      }
      .queue-title {
        margin-bottom: 7px;
        color: #dbeafe;
        font-size: 12px;
        font-weight: 700;
      }
      #queue-summary,
      #queue-running {
        color: #cbd5e1;
        font-size: 12px;
        line-height: 1.4;
      }
      #queue-list {
        display: grid;
        gap: 6px;
        margin-top: 8px;
      }
      .queue-job {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        padding: 7px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 7px;
        background: rgba(30, 41, 59, 0.46);
      }
      .queue-job-text {
        min-width: 0;
      }
      .queue-job-title {
        color: #dbeafe;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .queue-job-detail {
        margin-top: 2px;
        color: #94a3b8;
        font-size: 10px;
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .queue-job-actions {
        display: flex;
        gap: 4px;
      }
      .queue-job-actions button {
        padding: 4px 6px;
        font-size: 11px;
      }
      .health-line {
        padding: 7px 0;
        color: #cbd5e1;
        font-size: 12px;
        line-height: 1.35;
        overflow-wrap: anywhere;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }
      .health-line:last-child {
        border-bottom: 0;
      }
      .health-line[data-state="ok"] {
        color: #86efac;
      }
      .health-line[data-state="missing"] {
        color: #fca5a5;
      }
      #status {
        margin-top: 12px;
        color: #bac8da;
        font-size: 12px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>FluentFrame</h1>
        <div class="subtle">Local learning subtitles</div>
      </div>
      <button id="refresh-health" type="button" title="Refresh setup status">↻</button>
    </header>
    <button id="generate" type="button">Generate learning subtitles</button>
    <button id="enqueue-current" type="button">Add current video to queue</button>
    <form id="enqueue-url-form">
      <input id="enqueue-url" type="url" placeholder="Paste YouTube URL" />
      <button type="submit">Queue</button>
    </form>
    <section id="queue-card" class="status-card queue-card" aria-label="Generation queue">
      <div class="queue-title">Generation queue</div>
      <div id="queue-summary">Loading queue...</div>
      <div id="queue-running">Checking active job...</div>
      <div id="queue-list"></div>
    </section>
    <section class="status-card" aria-label="Setup status">
      <div id="native-host" class="health-line">Checking native host...</div>
      <div id="yt-dlp" class="health-line">Checking yt-dlp...</div>
      <div id="agent" class="health-line">Checking local agent...</div>
    </section>
    <div id="status">Checking FluentFrame setup...</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
