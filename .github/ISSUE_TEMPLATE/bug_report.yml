name: Bug Report
description: Something is not working as expected
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a FluentFrame bug. Please include enough detail to reproduce it."
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Chrome for Testing
        - Chromium
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, macOS 14, Ubuntu 24.04, ..."
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: "Run: node -v"
      placeholder: "v24.x.x"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: "Remove personal information and tokens before posting."
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Local checks
      options:
        - label: I reloaded the unpacked extension after rebuilding.
        - label: I reinstalled the native host after changing the extension ID.
        - label: I checked `~/.fluent-frame` for cache or notes issues.
